name = "AtlasCert"
version = "1.0.0"
keywords = ["math", "machine-learning", "loss-landscape", "formal-verification"]
defaultTargets = ["AtlasCert"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

[[lean_lib]]
name = "AtlasCert"
