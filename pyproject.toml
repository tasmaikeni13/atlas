[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-landscape"
version = "1.0.0"
description = "ATLAS: Adaptive Taylor Landscape Analysis System — Budget-optimal, certified loss landscape diagnostics for Transformers on Google Cloud TPUs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["deep-learning", "loss-landscape", "visualization", "optimization", "transformers", "jax", "flax", "tpu"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "jax>=0.4.20",
  "optax>=0.1.7",
  "flax>=0.8.0",
  "numpy>=1.23",
  "scipy>=1.10",
  "matplotlib>=3.6",
  "pillow>=9.0",
]

[project.optional-dependencies]
fineweb = ["datasets", "tiktoken"]

[project.urls]
Homepage = "https://github.com/tasmaikeni13/atlas"

[tool.setuptools.packages.find]
include = ["atlas*", "rag*"]
